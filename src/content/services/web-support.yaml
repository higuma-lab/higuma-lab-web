title: Webサイト制作の指導・サポート
group: web
order: 2
priceNote: 1時間5,000円（税込）
summary: AI と一緒にサイトを作りたい方や、作ったサイトをご自身で更新したい方をお手伝いします。
description: AI（Claude Code など）に相談しながら、ご自身でサイトを作ってみたい方に向けて、何を載せるか決めるところから公開するところまで、一緒に確認します。このサイトも AI と相談しながら作りました（ブログの構築記録で紹介しています）。ひぐま開発室が制作したサイトのお知らせやメニューなどを、ブラウザの管理画面からご自身で更新したい方のお手伝いもします。分からないところはその場で質問できるので、作業が止まりにくくなります。オンラインでもメールでもご相談いただけます。
examples:
  - AI を使って、自分のサイトを作ってみたい
  - 制作してもらったサイトの文章や写真を、自分で差し替えられるようになりたい
  - サイトを作るときに出てくる言葉（ドメイン、公開など）の意味から知りたい
