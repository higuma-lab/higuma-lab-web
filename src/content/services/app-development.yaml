# 対応プラットフォームは Windows。Android は相談のうえ（D-041、2026-10-23 に書き方を変更）
title: PC・タブレット・スマートフォン向けアプリ開発
group: app
order: 3
priceNote: お見積もり（機能を絞った小さなツールで10万円〜が目安）
summary: 業務の道具や身近な困りごとを解決するアプリを開発します。
description: Windows のパソコン・タブレット向けのアプリを開発します。Android のスマートフォン・タブレット向けは、内容をうかがったうえで、対応できるかをご相談します（iPhone・iPad には対応していません）。使う場面と必要な機能を整理したうえで開発します。長くソフトウェア開発に携わってきた経験を活かし、動作の安定性やデータの扱いにも気を配ります。
examples:
  - 手作業で行っている業務を、専用のアプリで楽にしたい
  - Excel での管理が複雑になってきた
  - アイデアはあるが、アプリにできるか分からない
