# 検証（docs/design.md 7.4、D-033）。PR で実行し、通過をマージの条件にする。deploy.yml からも呼び出す
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Site (lint, check, test, build, links, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

      # test:links・test:e2e はビルドから行うため、ビルド済みの dist/ に対してスクリプトを直接実行する
      - name: Check internal links
        run: node scripts/check-links.mjs

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright + axe)
        run: npx playwright test

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  infra:
    name: Infra (type check, test, synth)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test

      # AWS には接続しない。合成できることだけを確かめる（値は検証用のダミー）
      - name: CDK synth
        run: npm run synth -- --no-notices
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          DOMAIN_NAME: example.jp
          DEPLOY_GITHUB_REPOSITORY: ${{ github.repository }}
